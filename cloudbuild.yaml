steps:
  # 1. Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    id: "build"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest"
      - "."

  # 2. Push to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    id: "push"
    waitFor: ["build"]
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}"

  # 3. Deploy to Cloud Run (with Cloud SQL Unix socket)
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy"
    waitFor: ["push"]
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=8080"
      - "--memory=2048Mi"
      - "--cpu=8"
      - "--min-instances=1"
      - "--max-instances=3"
      # Cloud Run mounts the Cloud SQL Auth Proxy at
      # /cloudsql/<INSTANCE_CONNECTION_NAME> when this flag is set.
      - "--add-cloudsql-instances=${_CLOUDSQL_INSTANCE}"
      # Strip any stale TCP DB env vars from previous deploys so the app
      # ALWAYS picks the Cloud SQL socket path.
      - "--remove-env-vars=DATABASE_URL,MYSQL_HOST,MYSQL_PORT,DB_SSL_CA"
      # The app reads INSTANCE_CONNECTION_NAME and switches to unix_socket mode.
      # Password is passed as a plain env var (no Secret Manager).
      - "--set-env-vars=APP_ENV=production,APP_DEBUG=false,INSTANCE_CONNECTION_NAME=${_CLOUDSQL_INSTANCE},MYSQL_USER=${_MYSQL_USER},MYSQL_DATABASE=${_MYSQL_DATABASE},MYSQL_ROOT_PASSWORD=${_MYSQL_PASSWORD}"
      - "--update-env-vars=CORS_ORIGINS=${_CORS_ORIGINS}"

substitutions:
  _REGION: us-central1
  _REPOSITORY: nerius
  _SERVICE_NAME: nerius-backend
  # Cloud SQL: PROJECT_ID:REGION:INSTANCE_NAME (same project as Cloud Run).
  _CLOUDSQL_INSTANCE: "nerius:us-central1:nerius-mysql"
  _MYSQL_USER: "nerius"
  _MYSQL_DATABASE: "nerius"
  # DB password as plain env var. Override at submit-time:
  #   gcloud builds submit --substitutions=_MYSQL_PASSWORD='tu-password'
  _MYSQL_PASSWORD: "15a.62b.38c.ABC"
  # Set to your frontend URL, e.g. https://nerius.web.app,https://nerius.app
  _CORS_ORIGINS: "https://nerius-frontend-862131549348.us-central1.run.app"

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:$COMMIT_SHA"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE_NAME}:latest"

options:
  logging: CLOUD_LOGGING_ONLY
